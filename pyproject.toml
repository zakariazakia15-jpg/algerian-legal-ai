[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dz-legal-ai"
version = "0.1.2"
description = "Local, citation-first retrieval foundation for Algerian legal information"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]
dev = ["pytest>=8,<9"]

[project.scripts]
dz-legal-ai = "dz_legal_ai.cli:main"
dz-legal-ai-api = "dz_legal_ai.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
